<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVC Word Builder</title>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fefce8; margin: 0; padding: 40px; }
    h1 { text-align: center; color: #a16207; font-size: 36px; margin-bottom: 10px; }
    p { text-align: center; color: #ca8a04; font-size: 18px; margin-bottom: 40px; font-weight: bold; }
    .page { max-width: 800px; margin: 0 auto; background: white; border: 4px solid #fde047; padding: 40px; border-radius: 20px; box-shadow: 8px 8px 0 #fde047; }
    .question { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 2px dashed #fef08a; padding-bottom: 20px; }
    .image { font-size: 50px; }
    .boxes { display: flex; gap: 10px; }
    .box { width: 60px; height: 80px; border: 4px solid #eab308; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; font-size: 30px; color: #ca8a04; }
  </style>
</head>
<body>
  <div class="page">
    <h1>CVC Word Builder</h1>
    <p>Fill in the boxes to spell the consonant-vowel-consonant word!</p>
    
    <div class="question">
      <div class="image">🐱</div>
      <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>
    
    <div class="question">
      <div class="image">🐶</div>
      <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>
    
    <div class="question">
      <div class="image">☀️</div>
      <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>
    
    <div class="question">
      <div class="image">🦇</div>
      <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>
  </div>
</body>
</html>
